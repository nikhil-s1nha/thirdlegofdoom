# Real arm, 12 V 5 A supply (the rating the kit's BOM asks for).

arm:
  backend: feetech
  port: /dev/ttyACM0
  calibration: calib/mine.json
  servo_accel: 35      # rad/s². NOT a smoothness dial - bigger is harsher.
  torque_limit: 800

safety:
  max_speed: 3.5
  max_accel: 35
  max_jerk: 400.0
  min_height: 0.03

power:
  governor: false
  supply_current: 5.0
  headroom: 0.75
  min_voltage: 10.5

runtime:
  control_hz: 50
