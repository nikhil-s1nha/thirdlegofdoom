# Real arm on the undersized 12 V 2 A supply.
#
# The kit's bill of materials asks for 12 V 5 A. On 2 A the arm is fine
# with one joint moving and browns out with several, because six STS3215
# draw 180 mA each just to turn, before they lift anything -- see
# docs/power.md for the arithmetic. Everything below buys time until the
# right supply arrives; none of it is a substitute for one.
#
# Confirm the diagnosis rather than assuming it:  tlod power -c this-file

arm:
  backend: feetech
  port: /dev/ttyACM0  # confirm with `tlod ports` on the control board, edit if different
  calibration: calib/arm1.json
  # Acceleration of the servo's own internal ramp, rad/s^2 -- NOT a
  # smoothness dial. It maps to Goal_Acceleration, which is an
  # acceleration magnitude: bigger is harsher, and 0 switches the ramp off
  # for maximum harshness. 3.0 is a gentle ramp; the default is 9.2 and
  # the register saturates around 39.
  servo_accel: 3.0

safety:
  max_speed: 1.2      # rad/s. Was 2.0.
  # The one that governs current. Motor torque is inertia times
  # acceleration plus gravity, and current is torque over the torque
  # constant, so this is very nearly a direct current dial. Was 8.0.
  max_accel: 3.0
  # And this stops that current arriving as a step, which is what the
  # supply actually cannot absorb. Was 80.0.
  max_jerk: 30.0

power:
  governor: true      # slow down automatically rather than brown out
  supply_current: 2.0
  headroom: 0.7
  min_voltage: 10.5
