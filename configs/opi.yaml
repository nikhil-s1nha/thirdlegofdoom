camera:
  source: opencv
  # By id, not by number. The index is the order the kernel enumerated
  # things in, and this board shares that numbering with its Rockchip
  # codec nodes -- so remounting the camera, which means unplugging it,
  # renumbers it and every command naming an index is suddenly pointing at
  # a video decoder. Measured here across one remount: 1, then 0. The
  # by-id link comes from the device's own USB descriptor and does not
  # move. `-video-index0` is the capture node; index1 is metadata and
  # opens but never streams.
  index: /dev/v4l/by-id/usb-Arducam_Arducam_B0589_4K_HDR-video-index0
  width: 640
  height: 480
  fps: 60
  fourcc: MJPG
  hfov_deg: 74.0
  intrinsics: calib/intrinsics.npz
  extrinsics: calib/extrinsics.npz

arm:
  backend: feetech
  port: /dev/ttyACM0
  calibration: calib/mine.json
  servo_accel: 35.0
  torque_limit: 800
  # Back to 350. The 500 was mine, on a hypothesis this rig had already
  # disproved: an A/B at 350 and 500 moved neither contact cluster, and
  # peak load never passed 0.27 against either ceiling, so torque was
  # never the constraint. What it did do is press harder -- at 500 the
  # paddle drove through a hand to its floor on all twelve strikes of a
  # session, so every hit scored as a dodge. At 350 the same hand held it
  # 3-4 mm above the floor. The hand has to be able to stop the paddle,
  # because "stopped short of the floor" is the entire signal.
  #
  # 350 for now, but this is the knob that *widens* the hit/dodge gap
  # rather than sliding it around, and it has not been swept downward
  # yet. Same physics as the note on `press_depth` below: the paddle
  # stops where the servos' push-down force meets the palm's resistance,
  # so less authority means the palm holds it higher and the shortfall
  # grows. The trend is three points long and monotone -- at 500 the
  # paddle drove through a hand on all twelve strikes of a session; at
  # 350 leaning 3 mm the same hand held it; at 350 leaning 15 mm it went
  # through again.
  #
  # What bounds it from below is the swing, not the press: bench traces
  # peak at 0.21-0.30 of rated torque while braking the arm's own mass,
  # so a ceiling under ~0.30 starts clipping the descent itself and an
  # empty strike stops reaching its floor -- which kills the other half
  # of the signal. Sweep it over an empty table and keep the lowest
  # value where `descent arrived` still holds every time:
  #
  #     python3 scripts/strike_bench.py 0.36 0.165 --torque 300
  #     python3 scripts/strike_bench.py 0.36 0.165 --torque 250
  # How far below its commanded floor an unobstructed strike actually
  # stops, metres. 10 mm, and it is the number that decides hit from
  # dodge on this rig.
  #
  # A strike is ballistic on purpose -- `goto_pose` re-aims at what the
  # encoders report and `Strike` deliberately does not, since a second
  # pass is a second, slower descent -- so it carries the arm's full
  # static sag with nothing correcting it. Measured on the bench at
  # 0.36/0.165 against a commanded floor of 20 mm, nothing under the
  # paddle: it settled at 11, 8, 9 and 9 mm and held there for 300 ms.
  # A hand in the same geometry settles at 13-16.
  #
  # 9.5 mm rather than the measured ~10.8 because it is placed to centre
  # the threshold between the two clusters, not at the mean of one: it
  # puts the resting reference at 10.5 mm, so an empty strike reads
  # -2.5..+0.5 and a blocked one +2.5..+5.5 against a 1.5 mm threshold --
  # a millimetre of room on each side. Past about 10.5 the empty cluster
  # starts scoring hits.
  #
  # So both clusters sit ~10 mm *under* the floor, 2-5 mm apart, and a
  # threshold placed just above the floor is above both -- which is
  # precisely a session of "it hit me and the log said dodged".
  #
  # Re-measure over an empty table after anything that changes the
  # strike: reach, press_depth, strike_torque, the payload. This is the
  # `band_fraction` rule from docs/hit-detection.md in another form, and
  # the reason it kept biting is that the reference was never measured
  # at all.
  strike_sag: 0.0095
  strike_torque: 350
  # 8 mm, and shallower is the direction that works -- the opposite of
  # what "press deeper so the hand is definitely in the way" suggests,
  # so here is the whole sweep. Floor = the 30 mm hand plane less the
  # press; every row is a hand deliberately left in the way:
  #
  #     press 25 mm   floor  5 mm   paddle reached  4 mm   dodge, always
  #     press 20 mm   floor 10 mm   paddle reached 6-9 mm  dodge, always
  #     press 15 mm   floor 15 mm   paddle reached 12-16   dodge, always
  #      press 8 mm   floor 22 mm   paddle HELD at 24-26   hit
  #
  # It is not a gentle trend, it is a cliff between 15 and 8, and the
  # reason is that these servos are proportional position controllers.
  # Push-down force goes with the position error, so a floor 15 mm under
  # the palm leans on it several times as hard as a floor 3 mm under it.
  # Flesh yields: below some force the palm holds the paddle up, above it
  # the palm flattens and the paddle carries on to its floor. A deeper
  # press does not put the hand more firmly in the way, it just pushes
  # harder through it -- and reaching the floor is what the sensor calls
  # a dodge, so pressing harder is how a real hit gets scored as a miss.
  #
  # 10 mm, so the floor lands on a round 20 mm. 8 mm kept the lean under
  # the yield and produced hits at +2..+4 short; this leans 2 mm harder,
  # which is a small step *towards* the cliff and wants watching. If hits
  # start reading as dodges again, 8 is the known-good value to go back
  # to -- and the sweep above says do not go past about 12.
  #
  # Either way the gap between the clusters is only 2 mm, which is the
  # real problem and not one press_depth can fix: it slides both clusters
  # together. `strike_torque` above is the knob that pulls them apart.
  press_depth: 0.010
  # The droop no sensor here can see, fitted to ruler readings. With the
  # encoder-side sag already corrected -- forward kinematics reporting
  # 67-69 mm against a commanded 69 -- a ruler on the paddle read:
  #
  #     radius 0.224 m   52 mm   gap 15.4 mm
  #     radius 0.316 m   44 mm   gap 25.0 mm
  #     radius 0.396 m   36 mm   gap 33.0 mm
  #
  # Consecutive slopes 103.7 and 100.3 mm per metre, so it is a straight
  # line in the reach -- which is what a bending beam does, deflection
  # going with the moment arm. These two fit all three points inside
  # 0.3 mm.
  #
  # Feed-forward, not a loop: the thing being corrected is invisible to
  # every sensor on the machine, so there is nothing to close a loop on.
  # Re-measure with a ruler if the payload changes. See
  # ArmController.compensate.
  flex_gain: 0.102
  # -0.0034, four millimetres up from the fitted -0.0074. The slope was
  # right and the constant was not: measured after the fit, a commanded
  # 69 mm landed at 65 and a commanded 13 mm landed at 9. Same 4 mm at
  # both ends of the stroke, so it is a constant rather than a second
  # term in the height -- which also says the radius-only model holds at
  # the floor as well as at the hover, which was not obvious.
  flex_offset: -0.0034

safety:
  max_speed: 3.5
  max_accel: 35.0
  max_jerk: 400.0
  # Was the 0.33 default, which is a conservative keep-out rather than
  # anything the arm cannot do: IK solves cleanly out to 465 mm at play
  # height, and `model.MAX_REACH` of 0.36 is measured from the shoulder
  # axis, not the base origin. At 0.33 a hand at a natural distance on
  # this table sat outside the gate and the game refused to play, and the
  # hover was being clamped constantly -- 191 safety-guard hits in an
  # 11-round game, all of them the fence rather than a fault.
  #
  # 0.43 leaves ~35 mm before the IK gives up. Two things it costs, both
  # worth watching: the arm is near-straight out there, which is where
  # torque margin is worst and where `ik`'s weights start trading tool
  # orientation for position; and the contact thresholds were measured at
  # ~300 mm, so a strike at 430 mm decelerates differently. Recheck
  # hit/dodge if you start playing at the edge.
  # 0.43, because the table is this size and playing at 250 mm is not
  # playing. The stock 0.33 is a conservative keep-out, not a limit: IK
  # solves cleanly to 465 mm at play height, and `model.MAX_REACH` of 0.36
  # is measured from the shoulder axis rather than the base origin.
  #
  # Reaching this far costs authority, which is why `arm.strike_torque`
  # goes up with it -- see the note there. It also costs hover height: the
  # arm sags ~34 mm at 400 mm against ~13 at 300, so the strike starts
  # lower than it asks to and drops less far.
  max_radius: 0.43
  # This floor is only about not driving into the table -- and the table
  # is at z = 0, not 17 mm below it as this comment used to claim. Driven
  # to the joint angles at which the gripper rests on the table, FK
  # reports the tool at +0.2 mm: the riser is already absorbed into the
  # calibration, so model z is height above the work surface directly.
  # 5 mm therefore means 5 mm of air, not 22.
  #
  # It was 20 mm, back when the strike aimed 5 mm *above* the hand plane
  # and so never came near this. It does now: StrikeLimits.press_depth
  # commands 17 mm below the 22 mm hand plane, landing the floor exactly
  # here. Both contact sensors need that -- they ask whether the paddle
  # was stopped short, and a floor above the hand is one an untouched
  # paddle and a touched one both reach. 20 mm would clamp the floor
  # straight back to 20, undoing it silently and leaving nothing in the
  # log but a strike that stopped high.
  #
  # What bounds the force is arm torque_limit during the swing (350/1000,
  # a 0.038 lean against a rigid book), not this number.
  #
  # 0.007, not 0.005, because the arm and its base were lowered 2 mm. The
  # model frame rides with the base, so everything measured in it shifted
  # up by 2 mm relative to the world: the table is now at model z = +2 mm
  # rather than 0. Five millimetres of actual air is therefore 7 mm here.
  # Leaving it at 0.005 would have put the clamp 3 mm inside the table.
  # 0.007 = the original 0.005 plus the 2 mm the base was lowered. This
  # value ran a whole working session and nothing about the hardware has
  # changed since, so it is right.
  #
  # There is a known gap in the frame it is written in: the paddle sits
  # ~36 mm past the URDF's tool frame, so this permits the tip lower than
  # the number says. That gap predates every working run -- it is not what
  # broke anything -- and closing it would change what every other height
  # in this file means. Recorded here rather than corrected.
  min_height: 0.007

vision:
  num_hands: 1
  depth_mode: plane
  # Measured, not assumed. `--contact height` reports where the paddle
  # stops when a hand blocks it, and across a session that read 27-30 mm
  # -- so a flat palm's top surface sits at 28 mm, not the 22 mm that was
  # here. FK is trustworthy at that scale: driven to the joint angles
  # where the gripper rests on the table it reports +0.2 mm.
  #
  # This is not just the strike's target. With depth_mode: plane it is
  # the height the pixel ray is intersected against, and the camera looks
  # down at an angle, so an error here moves the tracked hand *sideways*
  # -- 0.87 mm per mm on this rig's geometry. The 6 mm that was wrong here
  # was putting the aim ~5 mm off to one side of every hand, always the
  # same side, which is what "it keeps hitting my index finger" was.
  # 0.030 for the same 2 mm as safety.min_height: a flat palm still sits
  # 28 mm above the table, but the base dropped 2 mm and the model frame
  # went with it, so that surface reads 30 mm in these coordinates.
  #
  # The physical geometry is unchanged, which is the point. press_depth
  # stays 17 mm, so the commanded floor moves 11 -> 13 mm in model terms
  # and stays at the same 11 mm of real air above the table, and the
  # contact band between floor and hand keeps exactly the width it was
  # calibrated with.
  hand_height: 0.030

runtime:
  prediction_horizon: 0.15
