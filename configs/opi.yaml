camera:
  source: opencv
  index: 0
  width: 640
  height: 480
  fps: 60
  fourcc: MJPG
  hfov_deg: 74.0
  intrinsics: calib/intrinsics.npz
  extrinsics: calib/extrinsics.npz

arm:
  backend: feetech
  port: ''
  calibration: calib/mine.json
  servo_accel: 35.0
  torque_limit: 800

safety:
  max_speed: 3.5
  max_accel: 35.0
  max_jerk: 400.0
  # This floor is only about not driving into the table, which sits 17 mm
  # below the base on its riser. 5 mm still leaves 22 mm of air.
  #
  # It was 20 mm, back when the strike aimed 5 mm *above* the hand plane
  # and so never came near this. It does now: StrikeLimits.press_depth
  # commands 10 mm below the estimated hand surface, because the press
  # sensor only reads something when the arm is blocked short of its
  # floor, and a floor above the hand means a real touch spends no torque
  # and scores as a dodge. That puts the target at 12 mm, which 20 mm
  # would clamp straight back to 20 -- undoing the change silently and
  # leaving nothing in the log but a strike that stopped high.
  #
  # What bounds the force is arm torque_limit during the swing (350/1000,
  # a 0.038 lean against a rigid book), not this number.
  min_height: 0.005

vision:
  num_hands: 1
  depth_mode: plane
  hand_height: 0.022

runtime:
  prediction_horizon: 0.15
