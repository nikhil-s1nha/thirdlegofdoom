camera:
  source: opencv
  index: 0
  width: 640
  height: 480
  fps: 60
  fourcc: MJPG
  hfov_deg: 74.0
  intrinsics: calib/intrinsics.npz
  extrinsics: calib/extrinsics.npz

arm:
  backend: feetech
  port: ''
  calibration: calib/mine.json
  servo_accel: 35.0
  torque_limit: 800

safety:
  max_speed: 3.5
  max_accel: 35.0
  max_jerk: 400.0
  # The strike's own plane_margin -- 5 mm above the target plane -- is the
  # guard that keeps a misjudged hand height harmless. This floor is only
  # about not driving into the table, which sits 17 mm below the base on
  # its riser, so 20 mm still leaves 37 mm. At 30 mm it was clipping the
  # last 3 mm off every strike and the paddle halted above the hand.
  min_height: 0.02

vision:
  num_hands: 1
  depth_mode: plane
  hand_height: 0.022

runtime:
  prediction_horizon: 0.15
