name: tests

on:
  push:
    branches: [main, arm-core, gamification]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The hand landmarker bundle is downloaded rather than vendored
      # (7.8 MB). Cached so CI does not refetch it every run.
      - uses: actions/cache@v4
        with:
          path: models
          key: mediapipe-hand-landmarker-v1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[hands,dev]"

      - name: Tests
        # The integration tests drive real threads against wall-clock
        # deadlines, so a heavily loaded runner can make them flaky. They
        # are the milestone-1 exit criterion and worth keeping in CI, but
        # with generous bounds rather than tight ones.
        run: pytest -q --durations=10

      - name: Simulation smoke test
        run: |
          tlod sim --duration 5
          tlod move 0.22 0 0.12
          tlod reach
